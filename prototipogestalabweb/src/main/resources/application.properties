spring.application.name=prototipogestalabweb
server.port=8081
# application.properties
gestalab.api.base-url=http://localhost:8080/api

# Desarrollo: no cachear las plantillas Thymeleaf.
# Con esto, al editar un .html basta con refrescar el navegador (F5);
# no hace falta reiniciar la aplicacion para ver el cambio.
spring.thymeleaf.cache=false

# Mostrar la causa real en la pagina de error en lugar de un mensaje generico.
server.error.include-message=always
server.error.include-stacktrace=on_param