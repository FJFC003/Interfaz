<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Editar Condición de Parámetro - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-plus"></i> Editar Condición de Parámetro</h1>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/condicionparametro/actualizar/{id}(id=${condicion.idCondicionParametroC})}" th:object="${condicion}" method="POST">

                            <div class="form-group mb-3">
                                <label for="codigoCondicionParametroC" class="form-control-label">Código</label>
                                <input type="text" class="form-control" id="codigoCondicionParametroC" th:field="*{codigoCondicionParametroC}" placeholder="Ej: 1">
                            </div>

                            <div class="form-group mb-3">
                                <label for="descripcionCondicionParametroC" class="form-control-label">Descripción</label>
                                <textarea class="form-control" id="descripcionCondicionParametroC" th:field="*{descripcionCondicionParametroC}" rows="3" placeholder="Ej: Acreditado"></textarea>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                                <a href="/condicionparametro/listar" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
