<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Descripción del Servicio - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800"><i class="fas fa-align-left"></i> Descripción del Servicio</h1>
            <a href="/descripcionservicio/nuevo" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Nuevo
            </a>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Lista de Descripción de Servicio</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                        <thead class="bg-light">
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Descripción del Servicio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${items}">
                                <td th:text="${c.idDescripcionServicioC}"></td>
                                <td th:text="${c.codigoDescripcionServicioC}"></td>
                                <td th:text="${c.textoDescripcionServicioC}"></td>
                                <td>
                                    <a th:href="@{/descripcionservicio/editar/{id}(id=${c.idDescripcionServicioC})}" class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/descripcionservicio/eliminar/{id}(id=${c.idDescripcionServicioC})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Está seguro?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
                    <i class="fas fa-info-circle"></i> No hay registros de Descripción de Servicio
                </div>
            </div>
        </div>

    </div>

</body>

</html>
