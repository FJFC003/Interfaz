<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Nuevo Empleado - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <!-- Page Heading -->
        <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-user-plus"></i> Registrar Nuevo Empleado</h1>

        <div th:if="${mensajeAviso}" class="alert alert-warning alert-dismissible fade show">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${mensajeAviso}">Aviso de validación</span>
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/empleado/guardar}" th:object="${empleado}" method="POST">
                            
                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="nombre" class="form-control-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="apellido" class="form-control-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="ci" class="form-control-label">Cédula</label>
                                    <input type="text" class="form-control" id="ci" th:field="*{ci}" placeholder="Ej: 1234567890" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="correo" class="form-control-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
                                </div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="direccion" class="form-control-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" th:field="*{direccion}">
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-4 mb-3">
                                    <label for="fechaIngreso" class="form-control-label">Fecha de Ingreso</label>
                                    <input type="date" class="form-control bg-light" id="fechaIngreso"
                                           th:field="*{fechaIngreso}" readonly required>
                                    <small class="form-text text-muted">
                                        La asigna el sistema con la fecha de hoy.
                                    </small>
                                </div>
                                <div class="col-sm-4 mb-3">
                                    <label for="fechaSalida" class="form-control-label">Fecha de Salida</label>
                                    <input type="date" class="form-control" id="fechaSalida" th:field="*{fechaSalida}">
                                    <small class="form-text text-muted">Dejar en blanco si el empleado sigue activo.</small>
                                </div>
                                <div class="col-sm-4 mb-3">
                                    <label for="estadoEmpleado" class="form-control-label">Estado</label>
                                    <div class="custom-control custom-checkbox mt-2">
                                        <input type="checkbox" class="custom-control-input" id="estadoEmpleado" th:field="*{estadoEmpleado}" checked>
                                        <label class="custom-control-label" for="estadoEmpleado">Activo</label>
                                    </div>
                                </div>
                            </div>

                            <hr>
                            <h6 class="font-weight-bold text-primary mb-3">Asignación Organizacional</h6>

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="fkArea" class="form-control-label">Área</label>
                                    <select class="form-control" id="fkArea" th:field="*{fkArea}">
                                        <option value="0">-- Seleccione un área --</option>
                                        <option th:each="area : ${areas}"
                                                th:value="${area.idArea}"
                                                th:text="${area.nombre}"></option>
                                    </select>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="fkCargo" class="form-control-label">Cargo</label>
                                    <select class="form-control" id="fkCargo" th:field="*{fkCargo}">
                                        <option value="0">-- Seleccione un cargo --</option>
                                        <option th:each="cargo : ${cargos}"
                                                th:value="${cargo.idCargo}"
                                                th:text="${cargo.nombre}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="fkRol" class="form-control-label">Rol</label>
                                    <select class="form-control" id="fkRol" name="fkRol">
                                        <option value="0">-- Seleccione un rol --</option>
                                        <option th:each="rol : ${roles}"
                                                th:value="${rol.idRol}"
                                                th:text="${rol.nombre}"></option>
                                    </select>
                                    <small class="form-text text-muted">
                                        El rol determina los permisos del empleado dentro del sistema.
                                    </small>
                                </div>
                            </div>

                            <hr>
                            <h6 class="font-weight-bold text-primary mb-3">Cuenta de Usuario</h6>

                           <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="usuarioNombre" class="form-control-label">Nombre de Usuario</label>
                                    <input type="text" class="form-control" id="usuarioNombre" name="usuarioNombre" placeholder="Ej: Carlos Villacis" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="usuarioCorreoLaboral" class="form-control-label">Correo Laboral</label>
                                    <input type="email" class="form-control" id="usuarioCorreoLaboral" name="usuarioCorreoLaboral" placeholder="Ej: coo.carlos@gestalab.ec" required>
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="usuarioContrasenia" class="form-control-label">Contraseña</label>
                                    <input type="password" class="form-control" id="usuarioContrasenia" name="usuarioContrasenia" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar
                                </button>
                                <a href="/empleado/listar" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function () {

                /*
                 * Compara dos valores de un input type="date". Vienen siempre como
                 * aaaa-mm-dd, asi que compararlos como texto equivale a compararlos
                 * cronologicamente. Se usa localeCompare y no el operador menor-que
                 * para no meter el caracter de apertura de etiqueta dentro del
                 * script, que es lo que confunde al parseador de plantillas.
                 */
                function esAnterior(valorA, valorB) {
                    if (!valorA) { return false; }
                    if (!valorB) { return false; }
                    return Math.sign(valorA.localeCompare(valorB)) === -1;
                }

                /*
                 * Ata dos campos de fecha: el segundo nunca puede ser anterior al
                 * primero. El calendario del navegador deja de ofrecer las fechas
                 * invalidas y, si el valor ya estaba puesto, el formulario avisa.
                 */
                function atarFechas(campoDesde, campoHasta, mensaje) {
                    if (!campoDesde) { return; }
                    if (!campoHasta) { return; }

                    function revisar() {
                        if (esAnterior(campoHasta.value, campoDesde.value)) {
                            campoHasta.setCustomValidity(mensaje);
                        } else {
                            campoHasta.setCustomValidity('');
                        }
                    }

                    function aplicarMinimo() {
                        if (campoDesde.value) {
                            campoHasta.min = campoDesde.value;
                        } else {
                            campoHasta.removeAttribute('min');
                        }
                        revisar();
                    }

                    campoDesde.addEventListener('change', aplicarMinimo);
                    campoDesde.addEventListener('input', aplicarMinimo);
                    campoHasta.addEventListener('change', revisar);
                    campoHasta.addEventListener('input', revisar);

                    /*
                     * Se aplica tambien al cargar la pagina. La fecha de ingreso es
                     * de solo lectura, asi que el evento change no llega a dispararse
                     * nunca y sin esta llamada el minimo no se pondria jamas.
                     */
                    aplicarMinimo();
                }

                atarFechas(
                    document.getElementById('fechaIngreso'),
                    document.getElementById('fechaSalida'),
                    'La fecha de salida no puede ser anterior a la fecha de ingreso.');
            });
        </script>
    </th:block>

</body>

</html>
