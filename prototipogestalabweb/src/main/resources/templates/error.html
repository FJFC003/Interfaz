<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Error - GestaLab</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css"/>
    <link href="/css/sb-admin-2.min.css" rel="stylesheet"/>
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg o-hidden border-0 my-5">
                    <div class="card-body p-5 text-center">

                        <div class="text-danger mb-3" style="font-size:3rem;">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>

                        <h1 class="h4 text-gray-900 mb-3">Ocurrió un error</h1>

                        <p class="mb-3 text-gray-700">
                            No se pudo completar la operación.
                        </p>

                        <!-- Detalle tecnico: ayuda a ubicar la causa sin ir a la consola -->
                        <div class="alert alert-light text-left small" th:if="${mensajeError != null}">
                            <strong>Detalle:</strong> <span th:text="${mensajeError}"></span>
                        </div>
                        <div class="alert alert-light text-left small" th:if="${status != null}">
                            <strong>Código:</strong> <span th:text="${status}"></span>
                            <span th:if="${error != null}"> — <span th:text="${error}"></span></span>
                        </div>
                        <div class="alert alert-light text-left small" th:if="${path != null}">
                            <strong>Ruta:</strong> <span th:text="${path}"></span>
                        </div>

                        <p class="small text-muted">
                            Si el detalle no es suficiente, revise la consola del backend.
                        </p>

                        <a href="javascript:history.back()" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i> Volver atrás
                        </a>
                        <a href="/" class="btn btn-secondary">
                            <i class="fas fa-home"></i> Inicio
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
