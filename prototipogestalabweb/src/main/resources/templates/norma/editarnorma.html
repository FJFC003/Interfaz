<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Editar Norma - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-plus"></i> Editar Norma</h1>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/norma/actualizar/{id}(id=${norma.idCatalogoNormServi})}" th:object="${norma}" method="POST">

                            <div class="form-group mb-3">
                                <label for="parametroCatalogoNormServiEntity" class="form-control-label">Parámetro (Norma Ambiental)</label>
                                <input type="text" class="form-control" id="parametroCatalogoNormServiEntity" th:field="*{parametroCatalogoNormServiEntity}">
                            </div>

                            <div class="form-group mb-3">
                                <label for="lmpCatalogoNormServiEntity" class="form-control-label">Límite Máximo Permisible (LMP)</label>
                                <input type="text" class="form-control" id="lmpCatalogoNormServiEntity" th:field="*{lmpCatalogoNormServiEntity}">
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                                <a href="/norma/listar" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
