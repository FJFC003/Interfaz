<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Nueva Norma - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-plus"></i> Registrar Nueva Norma</h1>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/norma/guardar}" th:object="${norma}" method="POST">

                            <div class="form-group mb-3">
                                <label for="nombreCatalogoNormServiEntity" class="form-control-label">Nombre de la Norma</label>
                                <textarea class="form-control" id="nombreCatalogoNormServiEntity" th:field="*{nombreCatalogoNormServiEntity}" rows="3" maxlength="255" placeholder="Ej: Acuerdo Ministerial 097-A. Libro VI. Anexo1. Tabla 1"></textarea>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                                <a href="/norma/listar" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
