<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{/plantilla/plantilla}">
<head><title>Nueva Orden de Trabajo - GestaLab</title></head>
<body>
<div layout:fragment="content">

    <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-clipboard-list"></i> F-PP-07-04: Orden de Ejecución del Trabajo</h1>

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow mb-4">
                <div class="card-header py-3" style="background-color:#c5d86d;">
                    <h6 class="m-0 font-weight-bold">DATOS DE LA ORDEN</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/ordentrabajo/guardar}" th:object="${orden}" method="POST">

                        <input type="hidden" th:field="*{fkPlanMuestreo}">

                        <div class="form-group row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-control-label">Plan de muestreo</label>
                                <input type="text" class="form-control" readonly th:value="${plan.codigoPlan}">
                            </div>
                            <div class="col-sm-6 mb-3"
                                 th:with="cot=${plan.fkDetalleCotizacion != null ? plan.fkDetalleCotizacion.fkCotizacion : null}">
                                <label class="form-control-label">Cotización aprobada</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${cot != null ? cot.idCotizacionC : '-'}">
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-sm-3 mb-3">
                                <label for="noItemOT" class="form-control-label">Ítem No. *</label>
                                <input type="number" class="form-control" id="noItemOT" th:field="*{noItemOT}" required>
                            </div>
                            <div class="col-sm-4 mb-3">
                                <label for="fechaEmisionOT" class="form-control-label">Fecha de emisión *</label>
                                <input type="date" class="form-control" id="fechaEmisionOT" th:field="*{fechaEmisionOT}" required>
                            </div>
                            <div class="col-sm-5 mb-3">
                                <label for="nombrePersonaContactoOT" class="form-control-label">Persona de contacto (cliente) *</label>
                                <input type="text" class="form-control" id="nombrePersonaContactoOT"
                                       th:field="*{nombrePersonaContactoOT}" required>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-sm-6 mb-3">
                                <label for="fkResponsableEmision" class="form-control-label">Responsable de emisión *</label>
                                <select class="form-control" id="fkResponsableEmision" th:field="*{fkResponsableEmision}" required>
                                    <option value="0">-- Seleccione --</option>
                                    <option th:each="emp : ${empleados}" th:value="${emp.idEmpleado}"
                                            th:text="${emp.nombre} + ' ' + ${emp.apellido}"></option>
                                </select>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="fkTecnicoAsignado" class="form-control-label">Técnico de campo asignado *</label>
                                <select class="form-control" id="fkTecnicoAsignado" th:field="*{fkTecnicoAsignado}" required>
                                    <option value="0">-- Seleccione --</option>
                                    <option th:each="emp : ${empleados}" th:value="${emp.idEmpleado}"
                                            th:text="${emp.nombre} + ' ' + ${emp.apellido}"></option>
                                </select>
                                <small class="text-muted">Este técnico verá la orden en su bandeja de trabajo.</small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-sm-4 mb-3">
                                <label for="fechaCierreCampoOT" class="form-control-label">Fecha de cierre en campo</label>
                                <input type="date" class="form-control" id="fechaCierreCampoOT" th:field="*{fechaCierreCampoOT}">
                                <small class="text-muted">Dejar en blanco al emitir la orden.</small>
                            </div>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Emitir Orden</button>
                            <a href="/ordentrabajo/listar" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
