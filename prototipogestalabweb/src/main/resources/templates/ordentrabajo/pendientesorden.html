<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{/plantilla/plantilla}">
<head><title>Planes disponibles - GestaLab</title></head>
<body>
<div layout:fragment="content">

    <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-flask"></i> Planes de Muestreo</h1>

    <div class="alert alert-info">
        <i class="fas fa-info-circle"></i>
        Seleccione el plan de muestreo sobre el que desea emitir la Orden de Ejecución del Trabajo.
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                    <thead class="bg-light">
                        <tr><th>Código</th><th>Organización</th><th>Objetivo</th><th>Responsable</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="plan : ${planes}">
                            <td th:text="${plan.codigoPlan}"></td>
                            <td th:text="${plan.fkDetalleCotizacion != null and plan.fkDetalleCotizacion.fkCotizacion != null and plan.fkDetalleCotizacion.fkCotizacion.fkCliente != null ? plan.fkDetalleCotizacion.fkCotizacion.fkCliente.nombreRazonSocialClienteC : '-'}"></td>
                            <td th:text="${plan.objetivoPlan}"></td>
                            <td th:text="${plan.fkResponsable != null ? plan.fkResponsable.nombre + ' ' + plan.fkResponsable.apellido : '-'}"></td>
                            <td>
                                <a th:href="@{/ordentrabajo/nuevo/{id}(id=${plan.idPlan})}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-plus"></i> Emitir OT</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(planes)}" class="alert alert-warning">
                No hay planes de muestreo. Cree uno primero desde Planes de Muestreo.
            </div>
        </div>
    </div>

</div>
</body>
</html>
