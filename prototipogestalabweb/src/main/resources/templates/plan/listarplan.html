<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Nuevo Plan de Muestreo - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-flask"></i> Nuevo Plan de Muestreo</h1>

        <div class="row justify-content-center">
            <div class="col-lg-9">

                <!-- INFORMACION DE LA ORGANIZACION (viene de la cotizacion, solo lectura) -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3" style="background-color:#c5d86d;">
                        <h6 class="m-0 font-weight-bold">INFORMACIÓN DE LA ORGANIZACIÓN</h6>
                    </div>
                    <div class="card-body">
                        <div class="form-group row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-control-label">Organización</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${cotizacion.fkCliente != null ? cotizacion.fkCliente.nombreRazonSocialClienteC : '-'}">
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-control-label">Contacto</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${cotizacion.fkCliente != null ? cotizacion.fkCliente.nombrePersonaContactoClienteC : '-'}">
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-control-label">Actividad</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${cotizacion.fkCliente != null ? cotizacion.fkCliente.tipoClienteC : '-'}">
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-control-label">Cotización aprobada</label>
                                <input type="text" class="form-control" readonly th:value="${cotizacion.idCotizacionC}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DATOS DEL PLAN -->
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/plan/guardar}" th:object="${plan}" method="POST">

                            <h6 class="font-weight-bold text-primary mb-3">Datos del Plan</h6>

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="codigoPlan" class="form-control-label">Identificación del plan de muestreo *</label>
                                    <input type="text" class="form-control" id="codigoPlan" th:field="*{codigoPlan}"
                                           placeholder="Ej: PM-26-235801" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="fechaElaboracion" class="form-control-label">Fecha de elaboración *</label>
                                    <input type="date" class="form-control" id="fechaElaboracion" th:field="*{fechaElaboracion}" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-12 mb-3">
                                    <label for="ObjetivoPlan" class="form-control-label">Objetivo *</label>
                                    <textarea class="form-control" id="ObjetivoPlan" th:field="*{ObjetivoPlan}" rows="3"
                                              placeholder="Ej: Determinar el parámetro cloro residual en agua residual de la descarga de la PTAR" required></textarea>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3">
                                    <label for="fkResponsable" class="form-control-label">Responsable del plan de muestreo *</label>
                                    <select class="form-control" id="fkResponsable" th:field="*{fkResponsable}" required>
                                        <option value="0">-- Seleccione --</option>
                                        <option th:each="emp : ${empleados}"
                                                th:value="${emp.idEmpleado}"
                                                th:text="${emp.nombre} + ' ' + ${emp.apellido}"></option>
                                    </select>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="fkDetalleCotizacion" class="form-control-label">Línea de cotización (servicio) *</label>
                                    <select class="form-control" id="fkDetalleCotizacion" th:field="*{fkDetalleCotizacion}" required>
                                        <option value="0">-- Seleccione --</option>
                                        <option th:each="det : ${detalles}"
                                                th:value="${det.idDetalleC}"
                                                th:text="'#' + ${det.idDetalleC} + ' - ' + (${det.fkParametro != null} ? ${det.fkParametro.ensayoParametroC} : 'Sin parámetro') + ' (' + ${det.cantidadPuntosDetalleC} + ' puntos)'"></option>
                                    </select>
                                    <small th:if="${#lists.isEmpty(detalles)}" class="text-danger d-block mt-1">
                                        Esta cotización no tiene líneas de detalle. Agréguelas antes de planificar.
                                    </small>
                                </div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Crear Plan y Continuar</button>
                                <a href="/plan/pendientes" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
