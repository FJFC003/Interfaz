<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Editar - Plazo de Entrega - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 class="h3 mb-4 text-gray-800"><i class="fas fa-edit"></i> Editar: Plazo de Entrega</h1>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/plazoentrega/actualizar/{id}(id=${item.idPlazoEntregaC})}" th:object="${item}" method="POST">

                            <div class="form-group mb-3">
                                <label for="codigoPlazoEntregaC" class="form-control-label">Código</label>
                                <input type="text" class="form-control" id="codigoPlazoEntregaC" th:field="*{codigoPlazoEntregaC}" placeholder="Ej: PE-01">
                            </div>

                            <div class="form-group mb-3">
                                <label for="textoPlazoEntregaC" class="form-control-label">Plazo de Entrega</label>
                                <textarea class="form-control" id="textoPlazoEntregaC" th:field="*{textoPlazoEntregaC}" rows="3" placeholder="Ej: 5 días hábiles"></textarea>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                                <a href="/plazoentrega/listar" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
