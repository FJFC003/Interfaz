<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Recuperar Acceso - GestaLab</title>

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-5">

                        <div class="text-center mb-4">
                            <i class="fas fa-key fa-3x text-primary mb-2"></i>
                            <h1 class="h4 text-gray-900">Recuperar Acceso</h1>
                            <p class="text-gray-600">
                                Escriba el correo de la cuenta de Gerente General.
                            </p>
                        </div>

                        <div class="alert alert-info small" role="alert">
                            <i class="fas fa-info-circle"></i>
                            El sistema no puede mostrarle su contraseña anterior porque no la
                            almacena: solo guarda una versión cifrada que no se puede revertir.
                            Lo que hará aquí es establecer una contraseña nueva.
                        </div>

                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/recuperar}" th:object="${solicitud}" method="POST" class="user">
                            <div class="form-group">
                                <label for="correo">Correo Electrónico</label>
                                <input type="email" class="form-control form-control-user" id="correo"
                                       th:field="*{correo}" placeholder="correo@ejemplo.com" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary btn-user btn-block">
                                <i class="fas fa-arrow-right"></i> Continuar
                            </button>
                        </form>

                        <hr>

                        <div class="text-center">
                            <a class="small" th:href="@{/login}">Volver al inicio de sesión</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
