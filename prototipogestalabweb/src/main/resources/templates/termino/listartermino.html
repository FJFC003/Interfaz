<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{/plantilla/plantilla}">

<head>
    <title>Lista de Términos - GestaLab</title>
</head>

<body>
    <div layout:fragment="content">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800"><i class="fas fa-file-contract"></i> Términos y Condiciones</h1>
            <a href="/termino/nuevo" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Nuevo Término
            </a>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Lista de Términos</h6>
            </div>
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="dataTable" width="100%" cellspacing="0">
                        <thead class="bg-light">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Contenido</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="termino : ${terminos}">
                                <td th:text="${termino.idTerminoC}"></td>
                                <td th:text="${termino.tituloTerminoC}"></td>
                                <td th:text="${#strings.abbreviate(termino.contenidoTerminoC, 100)}"></td>
                                <td>
                                    <a th:href="@{/termino/editar/{id}(id=${termino.idTerminoC})}" class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/termino/eliminar/{id}(id=${termino.idTerminoC})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Está seguro?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${#lists.isEmpty(terminos)}" class="alert alert-info">
                    <i class="fas fa-info-circle"></i> No hay términos registrados
                </div>

            </div>
        </div>

    </div>

</body>

</html>
